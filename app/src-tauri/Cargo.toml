[package]
name = "iclips"
version = "0.8.3"
description = "iClips : le studio de vos clips de jeu, sans iBox"
authors = ["atzski"]
license = "MIT"
edition = "2021"

[lib]
name = "iclips_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
gif = "0.13"
jpeg-encoder = "0.6"
# lien temporaire Litterbox (share.rs)
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
# son repris de Remote Play d'iBox (Rust pur)
opus-rs = "0.1.42"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Foundation_Collections", "Globalization", "Media_SpeechRecognition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Graphics_Capture", "Foundation", "Media_Control", "Security_Authorization_AppCapabilityAccess", "Storage_Streams", "Graphics", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Media_Speech"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization"] }
# `#[implement]` (rappel COM de l'activation du son par processus), même version que `windows`
windows-core = "0.62"
winreg = "0.56"
# liste de phrases de « Clip ça ! » (`voice.rs`) : collections WinRT, même version que `windows`
windows-collections = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# encodage des GIF et des images : rapide même en développement
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

# code chaud (images, GIF, son) : optimisé pour la vitesse, le reste reste compact
[profile.release.package.png]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.release.package.opus-rs]
opt-level = 3
